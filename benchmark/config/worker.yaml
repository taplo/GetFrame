server:
  host: "0.0.0.0"
  port: 8080

kafka:
  brokers: ""
  topic: "benchmark"
  acks: "none"
  compression: "none"
  consumer_group: "bench-group"
  schema_registry_url: ~
  partition_key_field: ~

storage:
  endpoint: ""
  region: "us-east-1"
  bucket: "benchmark"
  access_key: "benchmark"
  secret_key: "benchmark-key"
  path_style: true

preload_streams: []

logging: "info"
