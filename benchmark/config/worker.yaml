http:
  bind_address: "0.0.0.0"
  bind_port: 8080

kafka:
  brokers: "127.0.0.1:9092"
  topic: "benchmark"
  acks: "all"
  compression: "none"
  consumer_group: "bench-group"
  schema_registry_url: ~
  partition_key_field: ~

storage:
  endpoint_url: "http://minio:9000"
  region: "us-east-1"
  bucket: "benchmark"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"

preload_streams: []

logging:
  level: "info"
  json: false
